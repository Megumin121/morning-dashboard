<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё утро</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #090B10;
  color: #F2F2F6;
  font-family: Arial, sans-serif;
}

main { max-width: 520px; margin: auto; }
header { margin: 25px 0 28px; }

.small {
  color: #B5A1AC;
  font-size: 13px;
  letter-spacing: 1px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
  color: #F5EDF1;
}

.time { color: #C0C2CE; font-size: 15px; }

.card {
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
  border: 1px solid;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}

.card:nth-of-type(1) {
  background: linear-gradient(145deg,#351321,#21101A);
  border-color: #64243D;
}

.card:nth-of-type(2) {
  background: linear-gradient(145deg,#172D50,#101B30);
  border-color: #294D7D;
}

.card:nth-of-type(3) {
  background: linear-gradient(145deg,#301522,#21111D);
  border-color: #57263B;
}

.card h2 {
  font-size: 17px;
  margin: 0 0 16px;
  color: #F4EDF2;
}

.weather {
  display: flex;
  align-items: center;
  gap: 18px;
}

.temperature {
  font-size: 42px;
  font-weight: bold;
  color: #FFE6EF;
}

.muted {
  color: #C0B4BF;
  font-size: 14px;
}

#weatherDetails {
  display: none;
}

.forecast {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}

.forecast-item {
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 12px;
}

.forecast-time {
  color: #D7B8C7;
  font-size: 13px;
}

.forecast-temp {
  font-size: 23px;
  font-weight: bold;
  margin: 7px 0;
  color: #FFE6EF;
}

.forecast-info {
  font-size: 12px;
  color: #C0B4BF;
  line-height: 1.5;
}

.item {
  padding: 12px 0;
  border-bottom: 1px solid #573044;
}

.item:last-child { border: 0; }

.lesson {
  display: flex;
  gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid #30466A;
}

.lesson:last-child { border-bottom: 0; }

.lesson-time {
  min-width: 70px;
  color: #C2D4F2;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-line;
}

.lesson-title {
  font-size: 17px;
  font-weight: bold;
  line-height: 1.4;
  color: #F0F4FC;
}

.lesson-room {
  color: #AFC1DE;
  font-size: 13px;
  margin-top: 5px;
}

.empty {
  color: #C0C9D9;
  font-size: 14px;
  padding: 8px 0;
  line-height: 1.6;
}

footer {
  text-align: center;
  color: #858997;
  font-size: 12px;
  margin: 28px 0;
}

#weatherStatus,
#scheduleStatus {
  display: none;
}
</style>
</head>

<body>
<main>

<header>
  <div class="small" id="date"></div>
  <h1>Доброе утро!</h1>
  <div class="time" id="time"></div>
</header>

<section class="card">
  <h2>Погода · Уфа</h2>

  <div class="weather">
    <div class="temperature" id="temperature">—°</div>
    <div>
      <div id="description">Загружаем погоду...</div>
      <div class="muted" id="feels">Получаем данные</div>
    </div>
  </div>

  <div class="forecast">
    <div class="forecast-item">
      <div class="forecast-time">Сегодня · 15:00</div>
      <div class="forecast-temp" id="forecast15">—°</div>
      <div class="forecast-info" id="forecastInfo15">Загружаем...</div>
    </div>

    <div class="forecast-item">
      <div class="forecast-time">Сегодня · 21:00</div>
      <div class="forecast-temp" id="forecast21">—°</div>
      <div class="forecast-info" id="forecastInfo21">Загружаем...</div>
    </div>
  </div>

  <div id="weatherStatus"></div>
</section>

<section class="card">
  <h2>Расписание на сегодня</h2>
  <div id="schedule">
    <div class="empty">Загружаем расписание...</div>
  </div>
  <div id="scheduleStatus"></div>
</section>

<section class="card">
  <h2>Мои планы</h2>
  <div class="item">
    <div>Список задач пока не подключён</div>
    <div class="muted">Здесь появятся твои дела</div>
  </div>
</section>

<footer>ТВОЯ ЛИЧНАЯ УТРЕННЯЯ ПАНЕЛЬ</footer>

</main>

<script>
const TIME_ZONE = "Asia/Yekaterinburg";

function getToday() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TIME_ZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const values = {};
  parts.forEach(part => values[part.type] = part.value);

  return `${values.year}-${values.month}-${values.day}`;
}

function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString("ru-RU", {
      weekday: "long",
      day: "numeric",
      month: "long",
      timeZone: TIME_ZONE
    }).toUpperCase();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: TIME_ZONE
    });
}

updateClock();
setInterval(updateClock, 1000);

function weatherDescription(code) {
  const descriptions = {
    0: "☀️ Ясно",
    1: "🌤️ Преимущественно ясно",
    2: "⛅ Переменная облачность",
    3: "☁️ Облачно",
    45: "🌫️ Туман",
    48: "🌫️ Изморозь",
    51: "🌦️ Небольшая морось",
    53: "🌦️ Морось",
    55: "🌧️ Сильная морось",
    56: "🌧️ Ледяная морось",
    57: "🌧️ Сильная ледяная морось",
    61: "🌧️ Небольшой дождь",
    63: "🌧️ Дождь",
    65: "🌧️ Сильный дождь",
    66: "🌧️ Ледяной дождь",
    67: "🌧️ Сильный ледяной дождь",
    71: "❄️ Небольшой снег",
    73: "❄️ Снег",
    75: "❄️ Сильный снег",
    77: "🌨️ Снежная крупа",
    80: "🌦️ Ливень",
    81: "🌧️ Сильный ливень",
    82: "🌧️ Очень сильный ливень",
    85: "🌨️ Снегопад",
    86: "❄️ Сильный снегопад",
    95: "⛈️ Гроза",
    96: "⛈️ Гроза с градом",
    99: "⛈️ Сильная гроза"
  };

  return descriptions[code] || "Переменная погода";
}

function renderForecast(hourly, hour, elementId, infoId) {
  const target =
    `${getToday()}T${String(hour).padStart(2,"0")}:00`;

  const index = hourly.time.indexOf(target);

  const tempElement = document.getElementById(elementId);
  const infoElement = document.getElementById(infoId);

  if (index === -1 || hourly.temperature_2m[index] == null) {
    tempElement.textContent = "—°";
    infoElement.textContent = "Нет прогноза";
    return;
  }

  tempElement.textContent =
    Math.round(hourly.temperature_2m[index]) + "°";

  infoElement.textContent =
    weatherDescription(hourly.weather_code[index]);
}

async function loadWeather() {
  try {
    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=54.7388" +
      "&longitude=55.9721" +
      "&current=temperature_2m,apparent_temperature,weather_code" +
      "&hourly=temperature_2m,weather_code" +
      "&forecast_days=2" +
      "&timezone=Asia%2FYekaterinburg";

    const response = await fetch(url, {cache:"no-store"});

    if (!response.ok) throw new Error("Ошибка погоды");

    const data = await response.json();
    const current = data.current;

    if (!current || typeof current.temperature_2m !== "number") {
      throw new Error("Нет текущей погоды");
    }

    document.getElementById("temperature").textContent =
      Math.round(current.temperature_2m) + "°";

    document.getElementById("description").textContent =
      weatherDescription(current.weather_code);

    document.getElementById("feels").textContent =
      "Ощущается как " +
      Math.round(current.apparent_temperature) + "°";

    renderForecast(data.hourly, 15, "forecast15", "forecastInfo15");
    renderForecast(data.hourly, 21, "forecast21", "forecastInfo21");

  } catch (error) {
    console.error("Ошибка погоды:", error);

    try {
      const response = await fetch("./weather.json?t=" + Date.now(), {
        cache: "no-store"
      });

      if (!response.ok) throw new Error("Нет резервных данных");

      const data = await response.json();

      document.getElementById("temperature").textContent =
        Math.round(data.temperature) + "°";

      document.getElementById("description").textContent =
        data.symbol ? data.symbol.replaceAll("_", " ") : "Погода";

      document.getElementById("feels").textContent =
        "Ощущается как " + Math.round(data.feels_like) + "°";

      document.getElementById("forecastInfo15").textContent =
        "Прогноз временно недоступен";

      document.getElementById("forecastInfo21").textContent =
        "Прогноз временно недоступен";

    } catch (fallbackError) {
      document.getElementById("description").textContent =
        "Не удалось загрузить погоду";

      document.getElementById("feels").textContent =
        "Проверь подключение к интернету";

      document.getElementById("forecastInfo15").textContent = "Нет данных";
      document.getElementById("forecastInfo21").textContent = "Нет данных";
    }
  }
}

async function loadSchedule() {
  const container = document.getElementById("schedule");

  try {
    const response = await fetch(
      "./schedule.json?t=" + Date.now(),
      {cache:"no-store"}
    );

    if (!response.ok) throw new Error("Нет расписания");

    const data = await response.json();

    if (!Array.isArray(data.days)) {
      throw new Error("Некорректное расписание");
    }

    const today = getToday();
    const todayData = data.days.find(day => day.date === today);

    container.replaceChildren();

    if (data.week_start) {
      const weekStart = new Date(data.week_start + "T00:00:00Z");
      const todayDate = new Date(today + "T00:00:00Z");

      const difference =
        Math.floor((todayDate - weekStart) / 86400000);

      if (difference < 0 || difference > 6) {
        const message = document.createElement("div");
        message.className = "empty";
        message.textContent =
          "Расписание ещё не обновлено. Проверь позже.";
        container.appendChild(message);
        return;
      }
    }

    if (!todayData || !Array.isArray(todayData.lessons) ||
        todayData.lessons.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Сегодня пар нет. Можно немного отдохнуть!";
      container.appendChild(empty);
      return;
    }

    const lessons = [...todayData.lessons].sort((a,b) =>
      String(a.start || "").localeCompare(String(b.start || ""))
    );

    lessons.forEach(lesson => {
      const item = document.createElement("div");
      item.className = "lesson";

      const time = document.createElement("div");
      time.className = "lesson-time";
      time.textContent =
        `${lesson.start || "—"}\n${lesson.end || "—"}`;

      const info = document.createElement("div");

      const title = document.createElement("div");
      title.className = "lesson-title";
      title.textContent = lesson.title || "Предмет не указан";

      const room = document.createElement("div");
      room.className = "lesson-room";
      room.textContent = lesson.room
        ? "Кабинет: " + lesson.room
        : "Кабинет не указан";

      info.appendChild(title);
      info.appendChild(room);

      item.appendChild(time);
      item.appendChild(info);

      container.appendChild(item);
    });

  } catch (error) {
    container.replaceChildren();

    const message = document.createElement("div");
    message.className = "empty";
    message.textContent = "Не удалось загрузить расписание.";

    container.appendChild(message);
    console.error("Ошибка расписания:", error);
  }
}

loadWeather();
loadSchedule();

setInterval(loadWeather, 30 * 60 * 1000);
setInterval(loadSchedule, 30 * 60 * 1000);
setInterval(loadSchedule, 60 * 1000);
</script>
</body>
</html>
