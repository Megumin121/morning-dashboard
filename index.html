
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё утро</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #111318;
  color: #f1f2f5;
  font-family: Arial, sans-serif;
}

main {
  max-width: 520px;
  margin: auto;
}

header { margin: 25px 0 28px; }

.small {
  color: #9297a4;
  font-size: 13px;
  letter-spacing: 1px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
}

.time {
  color: #aeb3c0;
  font-size: 15px;
}

.card {
  background: #1c2029;
  border: 1px solid #2b303b;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
}

.card h2 {
  font-size: 17px;
  margin: 0 0 16px;
}

.weather {
  display: flex;
  align-items: center;
  gap: 18px;
}

.temperature {
  font-size: 42px;
  font-weight: bold;
}

.muted {
  color: #9297a4;
  font-size: 14px;
}

.item {
  padding: 12px 0;
  border-bottom: 1px solid #303541;
}

.item:last-child { border: 0; }

footer {
  text-align: center;
  color: #777e8c;
  font-size: 12px;
  margin: 28px 0;
}
</style>
</head>

<body>
<main>
  <header>
    <div class="small" id="date"></div>
    <h1>Доброе утро!</h1>
    <div class="time" id="time"></div>
  </header>

  <section class="card">
    <h2>Погода</h2>
    <div class="weather">
      <div class="temperature">—°</div>
      <div>
        <div>Подключим погоду</div>
        <div class="muted">Актуальные данные появятся позже</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Расписание</h2>
    <div class="item">
      <div>Расписание пока не подключено</div>
      <div class="muted">Здесь будут занятия на сегодня</div>
    </div>
  </section>

  <section class="card">
    <h2>Мои планы</h2>
    <div class="item">
      <div>Список задач пока не подключён</div>
      <div class="muted">Здесь появятся твои дела</div>
    </div>
  </section>

  <footer>ТВОЯ ЛИЧНАЯ УТРЕННЯЯ ПАНЕЛЬ</footer>
</main>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString("ru-RU", {
      weekday: "long",
      day: "numeric",
      month: "long"
    }).toUpperCase();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
