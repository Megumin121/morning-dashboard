
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё утро</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #090B10;
  color: #F2F2F6;
  font-family: Arial, sans-serif;
}

main { max-width: 520px; margin: auto; }

header { margin: 25px 0 28px; }

.small {
  color: #B5A1AC;
  font-size: 13px;
  letter-spacing: 1px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
  color: #F5EDF1;
}

.time { color: #C0C2CE; font-size: 15px; }

.card {
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
  border: 1px solid;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

/* ПОГОДА — ТЁМНЫЙ ВИШНЁВЫЙ */
.card:nth-of-type(1) {
  background: linear-gradient(145deg, #351321, #21101A);
  border-color: #64243D;
}

/* РАСПИСАНИЕ — НАСЫЩЕННЫЙ СИНИЙ */
.card:nth-of-type(2) {
  background: linear-gradient(145deg, #172D50, #101B30);
  border-color: #294D7D;
}

/* МОИ ПЛАНЫ — БОРДОВЫЙ */
.card:nth-of-type(3) {
  background: linear-gradient(145deg, #301522, #21111D);
  border-color: #57263B;
}

.card h2 {
  font-size: 17px;
  margin: 0 0 16px;
  color: #F4EDF2;
}

.weather {
  display: flex;
  align-items: center;
  gap: 18px;
}

.temperature {
  font-size: 42px;
  font-weight: bold;
  color: #FFE6EF;
}

.muted {
  color: #C0B4BF;
  font-size: 14px;
}

.item {
  padding: 12px 0;
  border-bottom: 1px solid #573044;
}

.item:last-child { border: 0; }

.lesson {
  display: flex;
  gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid #30466A;
}

.lesson:last-child { border-bottom: 0; }

.lesson-time {
  min-width: 70px;
  color: #C2D4F2;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-line;
}

.lesson-title {
  font-size: 17px;
  font-weight: bold;
  line-height: 1.4;
  color: #F0F4FC;
}

.lesson-room {
  color: #AFC1DE;
  font-size: 13px;
  margin-top: 5px;
}

.empty {
  color: #C0C9D9;
  font-size: 14px;
  padding: 8px 0;
  line-height: 1.6;
}

footer {
  text-align: center;
  color: #858997;
  font-size: 12px;
  margin: 28px 0;
}

#weatherDetails {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px solid #633047;
  line-height: 1.8;
  font-size: 14px;
  color: #E5D5DE;
}

/* СКРЫВАЕМ ТЕХНИЧЕСКИЕ ПОДПИСИ */
#weatherStatus,
#scheduleStatus {
  display: none;
}

</style>
</head>

<body>
<main>

  <header>
    <div class="small" id="date"></div>
    <h1>Доброе утро!</h1>
    <div class="time" id="time"></div>
  </header>

  <section class="card">
    <h2>Погода · Уфа</h2>

    <div class="weather">
      <div class="temperature" id="temperature">—°</div>
      <div>
        <div id="description">Загружаем погоду...</div>
        <div class="muted" id="feels">Получаем данные</div>
      </div>
    </div>

    <div id="weatherDetails"></div>
    <div class="muted" id="weatherStatus"></div>
  </section>

  <section class="card">
    <h2>Расписание на сегодня</h2>
    <div id="schedule">
      <div class="empty">Загружаем расписание...</div>
    </div>
    <div class="muted" id="scheduleStatus"></div>
  </section>

  <section class="card">
    <h2>Мои планы</h2>
    <div class="item">
      <div>Список задач пока не подключён</div>
      <div class="muted">Здесь появятся твои дела</div>
    </div>
  </section>

  <footer>ТВОЯ ЛИЧНАЯ УТРЕННЯЯ ПАНЕЛЬ</footer>

</main>

<script>

// ЧАСОВОЙ ПОЯС

const TIME_ZONE = "Asia/Yekaterinburg";

function getToday() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TIME_ZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const values = {};
  parts.forEach(part => values[part.type] = part.value);

  return `${values.year}-${values.month}-${values.day}`;
}


// ЧАСЫ

function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString("ru-RU", {
      weekday: "long",
      day: "numeric",
      month: "long",
      timeZone: TIME_ZONE
    }).toUpperCase();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: TIME_ZONE
    });
}

updateClock();
setInterval(updateClock, 1000);


// ОПИСАНИЕ ПОГОДЫ

function weatherDescription(symbol) {
  if (!symbol) return "Погодные условия неизвестны";

  const code = symbol.toLowerCase();

  if (code.includes("thunder")) return "⛈️ Гроза";
  if (code.includes("snow")) return "❄️ Снег";
  if (code.includes("sleet")) return "🌨️ Мокрый снег";
  if (code.includes("rain")) return "🌧️ Дождь";
  if (code.includes("fog")) return "🌫️ Туман";
  if (code.includes("clear")) return "☀️ Ясно";
  if (code.includes("partlycloudy")) return "🌤️ Переменная облачность";
  if (code.includes("cloudy")) return "☁️ Облачно";

  return "Переменная погода";
}


// ЗАГРУЗКА ПОГОДЫ

async function loadWeather() {
  const status = document.getElementById("weatherStatus");

  try {
    status.textContent = "Обновляем данные...";

    const response = await fetch("./weather.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Ошибка загрузки погоды");
    }

    const data = await response.json();

    if (
      typeof data.temperature !== "number" ||
      typeof data.feels_like !== "number" ||
      typeof data.wind_speed !== "number"
    ) {
      throw new Error("Некорректные данные погоды");
    }

    document.getElementById("temperature").textContent =
      Math.round(data.temperature) + "°";

    document.getElementById("description").textContent =
      weatherDescription(data.symbol);

    document.getElementById("feels").textContent =
      "Ощущается как " + Math.round(data.feels_like) + "°";

    const precipitation =
      typeof data.precipitation === "number"
        ? data.precipitation.toFixed(1) + " мм"
        : "Нет данных";

    document.getElementById("weatherDetails").innerHTML =
      "Ветер: " + data.wind_speed.toFixed(1) + " м/с" +
      "<br>Осадки за ближайший час: " + precipitation;

    const updated = new Date(data.updated);

    status.textContent =
      "Источник: MET Norway · обновлено в " +
      updated.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit",
        timeZone: TIME_ZONE
      });

  } catch (error) {
    document.getElementById("description").textContent =
      "Не удалось загрузить погоду";

    document.getElementById("feels").textContent =
      "Проверь подключение к интернету";

    status.textContent = "Попробуем загрузить данные позже";

    console.error(error);
  }
}


// ЗАГРУЗКА РАСПИСАНИЯ

async function loadSchedule() {
  const container = document.getElementById("schedule");
  const status = document.getElementById("scheduleStatus");

  try {
    status.textContent = "Обновляем расписание...";

    const response = await fetch(
      "./schedule.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Не удалось получить расписание");
    }

    const data = await response.json();

    if (!Array.isArray(data.days)) {
      throw new Error("Некорректный формат расписания");
    }

    const today = getToday();

    const todayData = data.days.find(day => day.date === today);

    container.replaceChildren();

    if (!todayData || !Array.isArray(todayData.lessons) ||
        todayData.lessons.length === 0) {

      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Сегодня пар нет. Можно немного отдохнуть!";
      container.appendChild(empty);

    } else {

      const lessons = [...todayData.lessons].sort((a, b) =>
        String(a.start || "").localeCompare(String(b.start || ""))
      );

      lessons.forEach(lesson => {
        const item = document.createElement("div");
        item.className = "lesson";

        const time = document.createElement("div");
        time.className = "lesson-time";
        time.textContent =
          `${lesson.start || "—"}\n${lesson.end || "—"}`;

        const info = document.createElement("div");

        const title = document.createElement("div");
        title.className = "lesson-title";
        title.textContent = lesson.title || "Предмет не указан";

        const room = document.createElement("div");
        room.className = "lesson-room";
        room.textContent = lesson.room
          ? "Кабинет: " + lesson.room
          : "Кабинет не указан";

        info.appendChild(title);
        info.appendChild(room);

        item.appendChild(time);
        item.appendChild(info);

        container.appendChild(item);
      });
    }

    status.textContent =
      "Группа 24Ю-3 · " + today +
      " · Обновление источника автоматически";

  } catch (error) {
    container.replaceChildren();

    const message = document.createElement("div");
    message.className = "empty";
    message.textContent = "Не удалось загрузить расписание.";

    container.appendChild(message);

    status.textContent = "Попробуем загрузить данные позже";

    console.error(error);
  }
}


// ЗАПУСК И ОБНОВЛЕНИЕ

loadWeather();
loadSchedule();

setInterval(loadWeather, 30 * 60 * 1000);
setInterval(loadSchedule, 30 * 60 * 1000);

// Проверяем смену дня
setInterval(loadSchedule, 60 * 1000);

</script>
</body>
</html>
