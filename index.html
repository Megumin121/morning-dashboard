
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё утро</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #111318;
  color: #f1f2f5;
  font-family: Arial, sans-serif;
}

main { max-width: 520px; margin: auto; }
header { margin: 25px 0 28px; }

.small {
  color: #9297a4;
  font-size: 13px;
  letter-spacing: 1px;
}

h1 { font-size: 32px; margin: 10px 0; }
.time { color: #aeb3c0; font-size: 15px; }

.card {
  background: #1c2029;
  border: 1px solid #2b303b;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
}

.card h2 { font-size: 17px; margin: 0 0 16px; }

.weather {
  display: flex;
  align-items: center;
  gap: 18px;
}

.temperature { font-size: 42px; font-weight: bold; }
.muted { color: #9297a4; font-size: 14px; }

.item {
  padding: 12px 0;
  border-bottom: 1px solid #303541;
}

.item:last-child { border: 0; }

footer {
  text-align: center;
  color: #777e8c;
  font-size: 12px;
  margin: 28px 0;
}

#weatherDetails {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px solid #303541;
  line-height: 1.8;
  font-size: 14px;
}

#weatherStatus { margin-top: 10px; }
</style>
</head>

<body>
<main>
  <header>
    <div class="small" id="date"></div>
    <h1>Доброе утро!</h1>
    <div class="time" id="time"></div>
  </header>

  <section class="card">
    <h2>Погода · Уфа</h2>
    <div class="weather">
      <div class="temperature" id="temperature">—°</div>
      <div>
        <div id="description">Загружаем погоду...</div>
        <div class="muted" id="feels">Получаем данные</div>
      </div>
    </div>
    <div id="weatherDetails"></div>
    <div class="muted" id="weatherStatus"></div>
  </section>

  <section class="card">
    <h2>Расписание</h2>
    <div class="item">
      <div>Расписание пока не подключено</div>
      <div class="muted">Здесь будут занятия на сегодня</div>
    </div>
  </section>

  <section class="card">
    <h2>Мои планы</h2>
    <div class="item">
      <div>Список задач пока не подключён</div>
      <div class="muted">Здесь появятся твои дела</div>
    </div>
  </section>

  <footer>ТВОЯ ЛИЧНАЯ УТРЕННЯЯ ПАНЕЛЬ</footer>
</main>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString("ru-RU", {
      weekday: "long",
      day: "numeric",
      month: "long",
      timeZone: "Asia/Yekaterinburg"
    }).toUpperCase();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "Asia/Yekaterinburg"
    });
}

updateClock();
setInterval(updateClock, 1000);

function weatherDescription(code) {
  const descriptions = {
    0: "Ясно ☀️",
    1: "Преимущественно ясно",
    2: "Переменная облачность",
    3: "Пасмурно ☁️",
    45: "Туман",
    48: "Изморозь",
    51: "Лёгкая морось",
    53: "Морось",
    55: "Сильная морось",
    61: "Небольшой дождь 🌧️",
    63: "Дождь",
    65: "Сильный дождь",
    71: "Небольшой снег ❄️",
    73: "Снег",
    75: "Сильный снег",
    80: "Ливень",
    81: "Сильный ливень",
    82: "Очень сильный ливень",
    95: "Гроза ⛈️",
    96: "Гроза с градом",
    99: "Сильная гроза с градом"
  };

  return descriptions[code] || "Переменная погода";
}

async function loadWeather() {
  const status = document.getElementById("weatherStatus");

  try {
    status.textContent = "Обновляем данные...";

    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=54.7388" +
      "&longitude=55.9721" +
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
      "&hourly=precipitation_probability" +
      "&daily=temperature_2m_max,temperature_2m_min" +
      "&timezone=Asia%2FYekaterinburg";

    const response = await fetch(url);

    if (!response.ok) throw new Error("Ошибка сервера");

    const data = await response.json();
    const current = data.current;

    document.getElementById("temperature").textContent =
      Math.round(current.temperature_2m) + "°";

    document.getElementById("description").textContent =
      weatherDescription(current.weather_code);

    document.getElementById("feels").textContent =
      "Ощущается как " +
      Math.round(current.apparent_temperature) + "°";

    const hour = current.time.slice(0, 13) + ":00";
    const index = data.hourly.time.indexOf(hour);

    const probability = index >= 0
      ? data.hourly.precipitation_probability[index]
      : null;

    document.getElementById("weatherDetails").innerHTML =
      "Ветер: " + Math.round(current.wind_speed_10m) + " км/ч" +
      "<br>Осадки: " +
      (probability === null ? "нет данных" : probability + "%") +
      "<br>Сегодня: " +
      Math.round(data.daily.temperature_2m_min[0]) + "° ... " +
      Math.round(data.daily.temperature_2m_max[0]) + "°";

    status.textContent = "Данные Open-Meteo · обновлено сейчас";
  } catch (error) {
    document.getElementById("description").textContent =
      "Не удалось загрузить погоду";

    document.getElementById("feels").textContent =
      "Проверь подключение к интернету";

    status.textContent = "Попробуем загрузить данные позже";
  }
}

loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);
</script>
</body>
</html>
