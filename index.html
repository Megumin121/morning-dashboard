
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё утро</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #111318;
  color: #f1f2f5;
  font-family: Arial, sans-serif;
}

main { max-width: 520px; margin: auto; }
header { margin: 25px 0 28px; }

.small {
  color: #9297a4;
  font-size: 13px;
  letter-spacing: 1px;
}

h1 { font-size: 32px; margin: 10px 0; }
.time { color: #aeb3c0; font-size: 15px; }

.card {
  background: #1c2029;
  border: 1px solid #2b303b;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
}

.card h2 { font-size: 17px; margin: 0 0 16px; }

.weather {
  display: flex;
  align-items: center;
  gap: 18px;
}

.temperature { font-size: 42px; font-weight: bold; }
.muted { color: #9297a4; font-size: 14px; }

.item {
  padding: 12px 0;
  border-bottom: 1px solid #303541;
}

.item:last-child { border: 0; }

footer {
  text-align: center;
  color: #777e8c;
  font-size: 12px;
  margin: 28px 0;
}

#weatherDetails {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px solid #303541;
  line-height: 1.8;
  font-size: 14px;
}

#weatherStatus { margin-top: 10px; }
</style>
</head>

<body>
<main>

  <header>
    <div class="small" id="date"></div>
    <h1>Доброе утро!</h1>
    <div class="time" id="time"></div>
  </header>

  <section class="card">
    <h2>Погода · Уфа</h2>

    <div class="weather">
      <div class="temperature" id="temperature">—°</div>
      <div>
        <div id="description">Загружаем погоду...</div>
        <div class="muted" id="feels">Получаем данные</div>
      </div>
    </div>

    <div id="weatherDetails"></div>
    <div class="muted" id="weatherStatus"></div>
  </section>

  <section class="card">
    <h2>Расписание</h2>
    <div class="item">
      <div>Расписание пока не подключено</div>
      <div class="muted">Здесь будут занятия на сегодня</div>
    </div>
  </section>

  <section class="card">
    <h2>Мои планы</h2>
    <div class="item">
      <div>Список задач пока не подключён</div>
      <div class="muted">Здесь появятся твои дела</div>
    </div>
  </section>

  <footer>ТВОЯ ЛИЧНАЯ УТРЕННЯЯ ПАНЕЛЬ</footer>

</main>

<script>

// ЧАСЫ И ДАТА

function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString("ru-RU", {
      weekday: "long",
      day: "numeric",
      month: "long",
      timeZone: "Asia/Yekaterinburg"
    }).toUpperCase();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "Asia/Yekaterinburg"
    });
}

updateClock();
setInterval(updateClock, 1000);


// ЗАГРУЗКА ПОГОДЫ ИЗ GITHUB

async function loadWeather() {
  const status = document.getElementById("weatherStatus");

  try {
    status.textContent = "Обновляем данные...";

    const response = await fetch("./weather.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Ошибка загрузки погоды");
    }

    const data = await response.json();

    if (
      typeof data.temperature !== "number" ||
      typeof data.feels_like !== "number" ||
      typeof data.wind_speed !== "number"
    ) {
      throw new Error("Некорректные данные");
    }

    document.getElementById("temperature").textContent =
      Math.round(data.temperature) + "°";

    document.getElementById("description").textContent =
      "Сейчас в Уфе";

    document.getElementById("feels").textContent =
      "Ощущается как " + Math.round(data.feels_like) + "°";

    document.getElementById("weatherDetails").textContent =
      "Ветер: " + data.wind_speed + " м/с";

    const updated = new Date(data.updated);

    status.textContent =
      "Источник: MET Norway · обновлено в " +
      updated.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "Asia/Yekaterinburg"
      });

  } catch (error) {

    document.getElementById("description").textContent =
      "Не удалось загрузить погоду";

    document.getElementById("feels").textContent =
      "Проверь подключение к интернету";

    status.textContent =
      "Попробуем загрузить данные позже";

    console.error(error);
  }
}

loadWeather();

// Проверяем обновление каждые 30 минут
setInterval(loadWeather, 30 * 60 * 1000);

</script>
</body>
</html>
