
name: Test college schedule

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download schedule
        run: |
          python - <<'PY'
          import urllib.request
          import json

          url = "https://raw.githubusercontent.com/LostCode09/uksivt-schedule/main/data/w/g67/2026-11-09.json"

          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))

              print("STATUS: OK")
              print("GROUP:", data.get("title"))
              print("WEEK:", data.get("week_start"))

              for day in data.get("days", []):
                  print("\n", day["name"], day["date"])
                  for lesson in day.get("lessons", []):
                      print(
                          lesson["start"],
                          "-",
                          lesson["end"],
                          lesson["title"],
                          "| Кабинет:",
                          lesson["room"]
                      )

          except Exception as error:
              print("ERROR:", repr(error))
              raise
          PY
 
