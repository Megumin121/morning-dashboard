
name: Test college schedule API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test schedule API
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          base = "https://uksivt.azurewebsites.net"

          endpoints = [
              "/api/schedule/week?groupName=24Ю-3",
              "/api/changes/week?groupName=24Ю-3"
          ]

          for endpoint in endpoints:
              url = base + endpoint

              print("\n" + "=" * 50)
              print("URL:", url)

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      data = response.read().decode(
                          "utf-8", errors="replace"
                      )

                      print("STATUS:", response.status)
                      print("RESPONSE:")
                      print(data[:5000])

              except Exception as error:
                  print("ERROR:", repr(error))
          PY
 
