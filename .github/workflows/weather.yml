name: Update Ufa weather

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get weather
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = (
              "https://api.met.no/weatherapi/locationforecast/2.0/compact"
              "?lat=54.7388&lon=55.9721"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "morning-dashboard/1.0 (https://github.com/megumin121/morning-dashboard)"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          current = data["properties"]["timeseries"][0]
          details = current["data"]["instant"]["details"]

          next_hour = current["data"].get("next_1_hours", {})
          next_details = next_hour.get("details", {})
          next_summary = next_hour.get("summary", {})

          result = {
              "city": "Уфа",
              "temperature": details.get("air_temperature"),
              "feels_like": details.get("air_temperature"),
              "wind_speed": details.get("wind_speed"),
              "symbol": next_summary.get("symbol_code"),
              "precipitation": next_details.get("precipitation_amount"),
              "updated": datetime.now(timezone.utc).isoformat(),
          }

          with open("weather.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)

          print("Weather saved:", result)
          PY

      - name: Save weather file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "Update Ufa weather"
          git push
